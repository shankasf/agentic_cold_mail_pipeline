name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Run CI checks first
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      issues: write

  # Build and push Docker image
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}

  # Deploy to staging (on push to main)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          echo "Image: ${{ needs.docker.outputs.image_tag }}"
          # Add your deployment commands here
          # Examples:
          # - SSH to server and pull new image
          # - Update Kubernetes deployment
          # - Trigger AWS ECS deployment
          # - Deploy to Vercel/Railway/etc.

      - name: Run database migrations
        run: |
          echo "Running database migrations on staging..."
          # npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Health check
        run: |
          echo "Running health check..."
          # curl -f ${{ vars.STAGING_URL }}/api/health || exit 1

  # Deploy to production (manual trigger only)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          echo "Image: ${{ needs.docker.outputs.image_tag }}"
          # Add your production deployment commands here

      - name: Run database migrations
        run: |
          echo "Running database migrations on production..."
          # npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Health check
        run: |
          echo "Running health check..."
          # curl -f ${{ vars.PRODUCTION_URL }}/api/health || exit 1

      - name: Notify deployment
        run: |
          echo "Production deployment completed!"
          # Add Slack/Discord/Email notification here

  # Create bug report on failure
  bug-report:
    name: Create Bug Report
    runs-on: ubuntu-latest
    needs: [ci, docker]
    if: always() && (needs.ci.result == 'failure' || needs.docker.result == 'failure')
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const workflow = '${{ github.workflow }}';
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${runId}`;
            const commit = '${{ github.sha }}'.substring(0, 7);
            const branch = '${{ github.ref_name }}';
            const actor = '${{ github.actor }}';
            const environment = '${{ github.event.inputs.environment }}' || 'staging';

            const title = `CD Failure: ${workflow} on ${branch} (${commit})`;
            const body = `## CD Pipeline Failure

            | Field | Value |
            |-------|-------|
            | **Workflow** | ${workflow} |
            | **Branch** | ${branch} |
            | **Commit** | ${commit} |
            | **Environment** | ${environment} |
            | **Triggered by** | @${actor} |
            | **Run URL** | [View Run](${runUrl}) |

            ### Failed Jobs
            Please check the [workflow run](${runUrl}) for details on which jobs failed.

            ### Next Steps
            1. Review the failed job logs
            2. Check Docker build or deployment configuration
            3. Fix the issue and re-run the deployment

            ---
            *This issue was automatically created by the CD workflow.*`;

            // Check for existing open issue with same title prefix
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cd-failure'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.startsWith(`CD Failure: ${workflow}`)
            );

            if (existingIssue) {
              // Add comment to existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `### New failure on ${branch} (${commit})\n\nEnvironment: ${environment}\n[View Run](${runUrl})\n\nTriggered by @${actor}`
              });
              console.log(`Added comment to existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['cd-failure', 'bug']
              });
              console.log('Created new CD failure issue');
            }
